# Save this file in your repo as: .github/workflows/daily.yml
name: Daily Current Affairs PDF

on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 AM IST every day (GitHub uses UTC)
  workflow_dispatch:        # lets you run it manually to test

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages (PDF engine + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Build PDF and send to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py

      - name: Keep a copy of the PDF
        uses: actions/upload-artifact@v4
        with:
          name: current-affairs-pdf
          path: Current_Affairs_*.pdf
